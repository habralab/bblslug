---
name: PHP Composer

on:
  push:
    branches: [ "main","develop","tests" ]
  pull_request:
    branches: [ "main","develop" ]

permissions:
  contents: read

jobs:
  test:

    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.3", "8.4", "8.5" ]
        dependencies: [ latest ]
        include:
          - php: "8.2"
            dependencies: lowest
          - php: "8.2"
            dependencies: yaml-7.4.23
            yaml: "7.4.23"
          - php: "8.4"
            dependencies: yaml-8.1.11
            yaml: "8.1.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json','**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install latest dependencies
        if: matrix.dependencies == 'latest'
        run: make install

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --optimize-autoloader

      - name: Install selected YAML version
        if: startsWith(matrix.dependencies, 'yaml-')
        run: composer update --with symfony/yaml:${{ matrix.yaml }} --prefer-stable --no-interaction --optimize-autoloader

      - name: Show YAML version and audit runtime dependencies
        run: |
          composer show symfony/yaml
          composer audit --no-dev

      - name: Lint PHP code (PSR-12)
        run: make test-phplint

      - name: Check documentation and generated catalogue
        run: |
          php tools/model-catalog.php --check
          php tools/check-docs.php

      - name: Run PHPUnit tests
        run: make test-phpunit

      - name: Check offline segment acceptance (no provider credentials or HTTP)
        run: BBLSLUG_SMOKE_SUITE=segments BBLSLUG_SMOKE_OFFLINE=1 php tools/live-smoke.php

      - name: Run PHPStan tests
        run: make test-phpstan

      - name: Upload PHPUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-report-php-${{ matrix.php }}-${{ matrix.dependencies }}
          path: .phpunit.junit.xml
          include-hidden-files: true
