        max_output_tokens: 128000
        estimated_max_chars: 4000000
      name: claude-fable-5
      notes: 'Provider text-generation model; account access may vary.'
      status: available
      kind: model
      access: standard
      checked_at: '2026-11-11'
      lifecycle_source: 'https://platform.claude.com/docs/en/about-claude/model-deprecations'
