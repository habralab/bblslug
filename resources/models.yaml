deepl:
  endpoint: 'https://api-free.deepl.com/v2/translate'
  format: text|html|json|linedJson
  defaults:
    target_lang: EN
    formality: prefer_more
  requirements:
    auth:
      type: header
      key_name: Authorization
      prefix: DeepL-Auth-Key
      help_url: 'https://www.deepl.com/account/summary'
    headers:
      - 'Content-Type: application/x-www-form-urlencoded'
    body_type: form
    params:
      - text
      - target_lang
  limits:
    estimated_max_chars: 30000
  models:
    free:
      name: 'DeepL API Free'
      requirements:
        auth:
          env: DEEPL_FREE_API_KEY
      notes: 'Text/HTML and native JSON document translation, with a limited monthly quota (free tier).'
    pro:
      name: 'DeepL API Pro'
      endpoint: 'https://api.deepl.com/v2/translate'
      requirements:
        auth:
          env: DEEPL_PRO_API_KEY
      notes: 'Reliable structured translation for production use, requires paid subscription.'
